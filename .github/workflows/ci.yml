name: CI
on:
  pull_request:
    branches:
    - main
    - dev
jobs:
  eslint:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Lint
        id: lint
        run: bun run lint

      - name: Build
        id: build
        run: bun run build

      - name: Discord notification on failure
        if: failure()
        run: |
          FAILED_STEP=""
          if [ "${{ steps.checkout.outcome }}" == "failure" ]; then FAILED_STEP="Checkout"; fi
          if [ "${{ steps.setup-bun.outcome }}" == "failure" ]; then FAILED_STEP="Setup Bun"; fi
          if [ "${{ steps.install.outcome }}" == "failure" ]; then FAILED_STEP="Install dependencies"; fi
          if [ "${{ steps.lint.outcome }}" == "failure" ]; then FAILED_STEP="Lint"; fi
          if [ "${{ steps.build.outcome }}" == "failure" ]; then FAILED_STEP="Build"; fi

          curl -H "Content-Type: application/json" \
          -d "{\"content\": \"🔴 **CI falló** en PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})\n**Paso que falló:** ${FAILED_STEP}\n**Rama:** ${{ github.head_ref }} → ${{ github.base_ref }}\n**Autor:** ${{ github.event.pull_request.user.login }}\n🔗 Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL_PRS }}
